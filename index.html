<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 1</title>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <h1>Лабораторная работа 1</h1>
        <p>ФИО: Беляев Ярослав Игоревич</p>
        <p>Группа: P3212</p>
        <p>Вриант: 12684</p>
    </header>
    <main>
        <div class="layout">
            <section>
                <canvas id="plane" width="400" height="400"></canvas>
            </section>
            <section>
                <form id="form" method="post">
                    <fieldset>
                        <legend>Введите значение X:</legend>
                        <div class="buttons">
                            <label><input type="radio" name="X" value="-4">-4</label><br>
                            <label><input type="radio" name="X" value="-3">-3</label><br>
                            <label><input type="radio" name="X" value="-2">-2</label><br>
                            <label><input type="radio" name="X" value="-1">-1</label><br>
                            <label><input type="radio" name="X" value="0" checked>0</label><br>
                            <label><input type="radio" name="X" value="1">1</label><br>
                            <label><input type="radio" name="X" value="2">2</label><br>
                            <label><input type="radio" name="X" value="3">3</label><br>
                            <label><input type="radio" name="X" value="4">4</label><br>
                        </div>
                    </fieldset>
                    <label for="POST-Y">Введите значение Y {-5 ... 5}:</label>
                    <input id="POST-Y" type="text" value="0" name="Y" inputmode="number" placeholder="Y" pattern = "[+\-]?[0-9]+([.,][0-9]+)?"><br>
                    <label for="POST-R">Введите значение R {2 ... 5}:</label>
                    <input id="POST-R" type="text" value="3,5" name="R" inputmode="number" checked="checked" placeholder="R" pattern = "[+\-]?[0-9]+([.,][0-9]+)?"><br>
                    <input id="submit_button" type="submit" value="Проверить попадание">
                </form>
                <noscript>Сегодня без JavaScript</noscript>
            </section>
        </div>
        <section>
            <h1>История попаданий</h1>
            <button id="clear_button" type="button">Очистить историю</button>
            <div class="check-table">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">X</th>
                            <th scope="col">Y</th>
                            <th scope="col">R</th>
                            <th scope="col">Результат</th>
                            <th scope="col">Дата и время</th>
                        </tr>
                    </thead>
                    <tbody id="results"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
